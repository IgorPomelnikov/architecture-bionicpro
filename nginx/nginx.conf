user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx/reports
        levels=1:2
        keys_zone=reports_cache:100m
        max_size=10g
        inactive=24h
        use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        location /reports/ {
            proxy_pass http://minio:9000/reports/;
            # Presigned SigV4 считается для Host клиента (S3_PRESIGN_ENDPOINT); иначе 403.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            # Пробрасываем ETag/Last-Modified от MinIO для revalidate (If-None-Match).
            proxy_pass_header ETag;
            proxy_pass_header Last-Modified;

            proxy_cache reports_cache;
            proxy_cache_key $scheme$http_host$request_uri;
            proxy_cache_valid 200 24h;
            proxy_cache_valid 404 1m;
            proxy_cache_revalidate on;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            add_header X-Cache-Status $upstream_cache_status always;
        }
    }
}
